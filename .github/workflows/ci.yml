name: COURTSIDE checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: courtside-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: courtside_ci
          POSTGRES_PASSWORD: ci_only_local_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d courtside_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:ci_only_local_password@127.0.0.1:5432/courtside_ci?schema=public
      APP_URL: https://courtside-ci.example
      NEXT_PUBLIC_SUPABASE_URL: https://courtside-ci.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_only
      SUPABASE_SERVICE_ROLE_KEY: ci_only_not_a_real_key
      AUTH_RECOVERY_SECRET: ci_only_recovery_secret_at_least_32_characters
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - name: Apply migrations to the disposable CI database
        run: npm run prisma:deploy
      - run: npm run test:ci
      - run: npm run lint
      - run: npm run build
      - name: Report dependency advisories and block critical findings
        run: npm run audit:runtime
